name: Daily Paper Trader

on:
  workflow_dispatch:
  schedule:
    - cron: "13,43 * * * *"
permissions:
  contents: read

concurrency:
  group: daily-paper-trader
  cancel-in-progress: false

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL || 'deepseek-ai/deepseek-v4.1-flash' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'nvidia' }}
      LLM_TIMEOUT_SECONDS: "45"
      LLM_MAX_ATTEMPTS: "2"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Validate configuration
        shell: bash
        run: |
          set -e
          test -n "$GOOGLE_SHEET_ID" || { echo "Missing GOOGLE_SHEET_ID secret"; exit 1; }
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON_BASE64" || { echo "Missing Google service account secret"; exit 1; }
          test -n "$COINGECKO_API_KEY" || { echo "Missing COINGECKO_API_KEY secret"; exit 1; }
          if [ -z "$NVIDIA_API_KEY" ] && [ -z "$GEMINI_API_KEY" ]; then
            echo "Configure at least one LLM API key"
            exit 1
          fi

      - name: Run paper trader
        run: python -m src.main
